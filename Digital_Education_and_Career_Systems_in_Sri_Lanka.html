<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="dashboard">
  <meta name="design-style" content="sticker">
  <title>Lingo Mate — Sri Lankan G.C.E. O/L &amp; A/L Foreign Language Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      /* Base Sticker Pastel System (dynamically themed per active language) */
      --background: #f2f7fd;
      --surface-container-low: #ffffff;
      --surface-container: #e6effa;
      --surface-container-high: #d7e6f7;

      --on-surface: #1e2433;
      --on-surface-variant: #4a5568;

      --outline: #8395b0;
      --outline-variant: #ccd8ea;

      --primary: #2d5fa8;
      --on-primary: #ffffff;
      --primary-container: #cfe2fc;
      --on-primary-container: #15315b;
      --secondary: #684ea3;
      --tertiary: #2386a8;
      --error: #c53030;
      --on-error: #ffffff;
      --positive: #1f7a4f;
      --positive-bg: #dcf5e8;
      --warning: #a3620a;
      --warning-bg: #fef0d5;

      /* Language Pastel Theme Swatches */
      --lang-fr-bg: #eef5fc; --lang-fr-soft: #dceafa; --lang-fr-accent: #2d5fa8;
      --lang-de-bg: #f1f8f4; --lang-de-soft: #ddefe3; --lang-de-accent: #277350;
      --lang-ja-bg: #fdf1f5; --lang-ja-soft: #fadce6; --lang-ja-accent: #b8326a;
      --lang-ko-bg: #f4f1fc; --lang-ko-soft: #e5defa; --lang-ko-accent: #5d43a6;
      --lang-zh-bg: #fdf4ee; --lang-zh-soft: #fbe2d2; --lang-zh-accent: #b84a27;

      /* 5 Distinct Level Pastel Treatments (dark readable text on soft pastel) */
      --lvl-1-bg: #e7f6ec; --lvl-1-accent: #1f7a4f; --lvl-1-border: #9fd8b4;
      --lvl-2-bg: #e6f2fc; --lvl-2-accent: #245ca8; --lvl-2-border: #9dc5f2;
      --lvl-3-bg: #f1ebfc; --lvl-3-accent: #5e3ea1; --lvl-3-border: #c5b0f0;
      --lvl-4-bg: #fef3e2; --lvl-4-accent: #9c560d; --lvl-4-border: #f0c98d;
      --lvl-5-bg: #fdeaf0; --lvl-5-accent: #a62658; --lvl-5-border: #eba3be;

      /* Data series */
      --data-1: #2d5fa8;
      --data-2: #684ea3;
      --data-3: #2386a8;
      --data-4: #b84a27;
      --data-5: #1f7a4f;
      --data-context: #c6d0df;

      /* Fonts */
      --font-headline: 'DM Sans', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      --font-body: 'DM Sans', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      --font-label: 'DM Sans', sans-serif;

      /* Type scale */
      --display-size: clamp(1.65rem, 1.35rem + 1.1vw, 2.15rem);
      --headline-size: clamp(1.2rem, 1.08rem + 0.45vw, 1.45rem);
      --subhead-size: clamp(1.02rem, 0.96rem + 0.2vw, 1.15rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.12vw, 1rem);
      --label-size: 0.75rem;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;

      /* Shape & Style effects */
      --rounded: 1rem;
      --rounded-lg: 1.5rem;
      --rounded-full: 9999px;
      --shadow-tint: 0 6px 18px rgb(45 95 168 / 0.12);
      --shadow-tint-deep: 0 10px 26px rgb(45 95 168 / 0.22);
      --shadow-soft: 0 4px 14px rgb(30 36 51 / 0.06);
      --focus: var(--primary);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 380ms;
    }

    /* Language pastel theme overrides */
    body[data-lang="fr"] {
      --background: var(--lang-fr-bg); --surface-container: var(--lang-fr-soft);
      --primary: var(--lang-fr-accent); --primary-container: #cfe2fc; --on-primary-container: #15315b;
      --shadow-tint: 0 6px 18px rgb(45 95 168 / 0.13);
    }
    body[data-lang="de"] {
      --background: var(--lang-de-bg); --surface-container: var(--lang-de-soft);
      --primary: var(--lang-de-accent); --primary-container: #ccebd8; --on-primary-container: #14422c;
      --shadow-tint: 0 6px 18px rgb(39 115 80 / 0.13);
    }
    body[data-lang="ja"] {
      --background: var(--lang-ja-bg); --surface-container: var(--lang-ja-soft);
      --primary: var(--lang-ja-accent); --primary-container: #f8cfe0; --on-primary-container: #5c1332;
      --shadow-tint: 0 6px 18px rgb(184 50 106 / 0.13);
    }
    body[data-lang="ko"] {
      --background: var(--lang-ko-bg); --surface-container: var(--lang-ko-soft);
      --primary: var(--lang-ko-accent); --primary-container: #ddd3fa; --on-primary-container: #311f66;
      --shadow-tint: 0 6px 18px rgb(93 67 166 / 0.13);
    }
    body[data-lang="zh"] {
      --background: var(--lang-zh-bg); --surface-container: var(--lang-zh-soft);
      --primary: var(--lang-zh-accent); --primary-container: #fad6c0; --on-primary-container: #5e220e;
      --shadow-tint: 0 6px 18px rgb(184 74 39 / 0.13);
    }

    /* Base reset */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; margin: 0; padding: 0; }
    header { position: static !important; }
    body {
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      color: var(--on-surface);
      background-color: var(--background);
      transition: background-color var(--dur-long) var(--ease-out);
    }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    h1, h2, h3, h4, p { margin: 0; }

    /* Focus rings */
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* Shell layout */
    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      gap: var(--space-lg);
      padding: var(--space-md);
    }
    .app-shell * { min-width: 0; }

    /* Sidebar Navigation */
    .sidebar {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-tint);
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      align-self: start;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--outline-variant);
    }
    .brand-mark {
      width: 44px; height: 44px;
      border-radius: var(--rounded-full);
      background: var(--primary-container);
      color: var(--on-primary-container);
      display: grid; place-items: center;
      font-weight: 800; font-size: 1.15rem;
      flex-shrink: 0;
    }
    .brand-title { font-weight: 900; font-size: 1.2rem; letter-spacing: -0.02em; color: var(--on-surface); }
    .brand-sub { font-size: var(--label-size); color: var(--on-surface-variant); font-weight: 600; }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      width: 100%;
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: var(--rounded-full);
      background: transparent;
      color: var(--on-surface);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      text-align: left;
      transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-short) var(--ease-bounce);
    }
    .nav-btn:hover { background: var(--surface-container); transform: translateX(2px); }
    .nav-btn[aria-current="page"] {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-tint);
    }
    .nav-group-label {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--on-surface-variant);
      padding: var(--space-sm) var(--space-md) var(--space-xs);
    }

    /* Main Content Area */
    .main-col {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }
    .topbar {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-tint);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    .mobile-menu-btn {
      display: none;
      min-height: 44px;
      min-width: 44px;
      align-items: center;
      justify-content: center;
      border-radius: var(--rounded-full);
      border: 1px solid var(--outline-variant);
      background: var(--surface-container);
      cursor: pointer;
    }
    .context-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
    }

    /* Typography */
    .display-title {
      font-family: var(--font-headline);
      font-weight: 900;
      font-size: var(--display-size);
      letter-spacing: -0.03em;
      line-height: 1.08;
    }
    .display-title em { font-style: normal; color: var(--primary); }
    .section-title {
      font-family: var(--font-headline);
      font-weight: 800;
      font-size: var(--headline-size);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .card-title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--subhead-size);
      line-height: 1.3;
    }
    .kicker {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--on-surface-variant);
    }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Cards & Grids */
    .card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-tint);
      padding: var(--space-lg);
      transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out);
    }
    .card-hero {
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      background: var(--surface-container-low);
      box-shadow: var(--shadow-tint);
    }
    .card-soft {
      background: var(--surface-container);
      border-radius: var(--rounded);
      padding: var(--space-md);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: var(--space-md);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
      gap: var(--space-md);
    }
    .split-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      gap: var(--space-lg);
      align-items: start;
    }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      border: 2px solid transparent;
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), background-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
    }
    .btn:hover:not(:disabled) { transform: scale(1.02); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-tint); }
    .btn-primary:hover:not(:disabled) { box-shadow: var(--shadow-tint-deep); }
    .btn-secondary { background: var(--primary-container); color: var(--on-primary-container); }
    .btn-outline { background: var(--surface-container-low); border-color: var(--outline); color: var(--on-surface); }
    .btn-ghost { background: transparent; color: var(--primary); padding: var(--space-xs) var(--space-md); }
    .btn-sm { min-height: 36px; padding: var(--space-xs) var(--space-md); font-size: 0.875rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      font-size: var(--label-size);
      font-weight: 700;
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .badge-positive { background: var(--positive-bg); color: var(--positive); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-neutral { background: var(--surface-container); color: var(--on-surface-variant); }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--surface-container-high);
      border-radius: var(--rounded-full);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: var(--rounded-full);
      transition: width var(--dur-long) var(--ease-out);
    }

    /* Level 1-5 Distinct Treatments (dark readable text, high contrast) */
    .lvl-card {
      border-radius: var(--rounded);
      padding: var(--space-lg);
      border: 2px solid transparent;
      color: var(--on-surface);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    .lvl-1 { background: var(--lvl-1-bg); border-color: var(--lvl-1-border); }
    .lvl-1 .lvl-pill { background: var(--lvl-1-accent); color: var(--on-primary); }
    .lvl-2 { background: var(--lvl-2-bg); border-color: var(--lvl-2-border); }
    .lvl-2 .lvl-pill { background: var(--lvl-2-accent); color: var(--on-primary); }
    .lvl-3 { background: var(--lvl-3-bg); border-color: var(--lvl-3-border); }
    .lvl-3 .lvl-pill { background: var(--lvl-3-accent); color: var(--on-primary); }
    .lvl-4 { background: var(--lvl-4-bg); border-color: var(--lvl-4-border); }
    .lvl-4 .lvl-pill { background: var(--lvl-4-accent); color: var(--on-primary); }
    .lvl-5 { background: var(--lvl-5-bg); border-color: var(--lvl-5-border); }
    .lvl-5 .lvl-pill { background: var(--lvl-5-accent); color: var(--on-primary); }
    .lvl-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: var(--rounded-full);
      font-size: var(--label-size); font-weight: 800; width: fit-content;
    }

    /* Form Controls */
    .field { display: flex; flex-direction: column; gap: var(--space-xs); }
    .field label { font-size: 0.875rem; font-weight: 700; color: var(--on-surface); }
    .input, .select {
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded-full);
      border: 2px solid var(--outline-variant);
      background: var(--surface-container-low);
      color: var(--on-surface);
      width: 100%;
    }
    .select { padding-right: var(--space-xl); }
    .input:focus, .select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-container); }

    /* Interactive elements inside lessons & games */
    .chip-row { display: flex; flex-wrap: wrap; gap: var(--space-sm); align-items: center; }
    .chip {
      min-height: 40px;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      border: 2px solid var(--outline-variant);
      background: var(--surface-container-low);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), background-color var(--dur-micro) var(--ease-out);
    }
    .chip:hover { transform: scale(1.03); background: var(--surface-container); }
    .chip.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

    .script-box {
      font-size: clamp(1.75rem, 1.4rem + 1.5vw, 2.5rem);
      font-weight: 800;
      line-height: 1.25;
      color: var(--on-surface);
      letter-spacing: 0;
      text-transform: none;
    }
    .ko-text { word-break: keep-all; overflow-wrap: break-word; }

    .vocab-row {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1.2fr auto;
      gap: var(--space-sm);
      align-items: center;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      background: var(--surface-container);
    }

    .tone-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-sm);
    }
    .tone-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      padding: var(--space-sm);
      text-align: center;
      border: 2px solid var(--outline-variant);
    }

    .chart-box { min-height: 280px; position: relative; width: 100%; }

    .feedback-banner {
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      font-weight: 700;
      margin-top: var(--space-sm);
    }
    .feedback-ok { background: var(--positive-bg); color: var(--positive); }
    .feedback-err { background: var(--warning-bg); color: var(--error); }

    .avatar-btn {
      width: 56px; height: 56px;
      border-radius: var(--rounded-full);
      border: 3px solid transparent;
      background: var(--surface-container);
      font-size: 1.65rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform var(--dur-short) var(--ease-bounce);
    }
    .avatar-btn.active { border-color: var(--primary); background: var(--primary-container); transform: scale(1.06); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: var(--space-sm) var(--space-md); text-align: left; }
    thead th { background: var(--surface-container); font-size: var(--label-size); text-transform: uppercase; letter-spacing: 0.05em; }
    tbody tr:nth-child(even) { background: var(--background); }

    /* Mobile Drawer & Breakpoints */
    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.open { display: flex; }
      .mobile-menu-btn { display: inline-flex; }
      .split-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .app-shell { padding: var(--space-sm); gap: var(--space-md); }
      .vocab-row { grid-template-columns: 1fr; }
      .tone-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body data-lang="fr">
  <div class="app-shell">
    <!-- Sidebar Navigation (12 Dashboards) -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" id="sidebar-avatar" aria-hidden="true">L</div>
        <div>
          <div class="brand-title">Lingo Mate</div>
          <div class="brand-sub">SL G.C.E. O/L &amp; A/L Studio</div>
        </div>
      </div>

      <nav class="nav-list" id="nav-list">
        <div class="nav-group-label">Study Hub</div>
        <button class="nav-btn" data-view="home" onclick="navigateTo('home')" aria-current="page"><i data-lucide="home"></i> Home</button>
        <button class="nav-btn" data-view="languages" onclick="navigateTo('languages')"><i data-lucide="globe"></i> Languages</button>
        <button class="nav-btn" data-view="category" onclick="navigateTo('category')"><i data-lucide="graduation-cap"></i> O/L &amp; A/L Pathway</button>
        <button class="nav-btn" data-view="levels" onclick="navigateTo('levels')"><i data-lucide="layers"></i> 5-Level Roadmap</button>
        <button class="nav-btn" data-view="lessons" onclick="navigateTo('lessons')"><i data-lucide="book-open"></i> Lessons &amp; Scripts</button>

        <div class="nav-group-label">Practice &amp; Play</div>
        <button class="nav-btn" data-view="activities" onclick="navigateTo('activities')"><i data-lucide="puzzle"></i> Learning Activities</button>
        <button class="nav-btn" data-view="games" onclick="navigateTo('games')"><i data-lucide="gamepad-2"></i> 10 Mini-Games</button>

    async function loadAppState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object`) {
            appState = mergeDeep(cloneState(DEFAULT_STATE), saved);
          }
        }
      } catch (e) {
        // Fallback silently to default state
      }
    }

    async function saveAppState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
          await window.notebookAppApi.setAppState(appState);
        }
      } catch (e) {
        // Safe ignore in offline test
      }
    }

    function mergeDeep(target, source) {
      for (const key of Object.keys(source)) {
        if (source[key] && typeof source[key] === `object` && !Array.isArray(source[key])) {
          if (!target[key] || typeof target[key] !== `object`) target[key] = {};
          mergeDeep(target[key], source[key]);
        } else {
          target[key] = source[key];
        }
      }
      return target;
    }

    // =========================================================================
    // 3. AUDIO & SPEECH SIMULATION (Web Speech API + Web Audio Chime)
    // =========================================================================
    function speakText(text, langId) {
      const lang = LANGUAGES[langId || appState.activeLang] || LANGUAGES.fr;
      playTone(523.25, 0.08);
      if (`speechSynthesis` in window) {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = lang.speechLang;
          utter.rate = 0.92;
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }
    }

    function playTone(freq, duration) {
      if (!appState.profile.notifications.soundEffects) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = `sine`;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // 4. HELPERS & PROGRESS CALCULATIONS
    // =========================================================================
    function getEffectiveCategoryKey() {
      return appState.category === `AL` ? `AL` : `OL`;
    }

    function getUnlockedLevel(langId, catKey) {
      const l = appState.unlockedLevels[langId] || { OL: 1, AL: 1 };
      if (appState.category === `Both`) return Math.max(l.OL || 1, l.AL || 1);
      return l[catKey || getEffectiveCategoryKey()] || 1;
    }

    function getLangLessons(langId) {
      return LESSONS.filter(x => x.lang === langId);
    }

    function getLangProgressPct(langId) {
      const all = getLangLessons(langId);
      if (!all.length) return 0;
      const done = all.filter(l => appState.completedLessons.includes(l.id)).length;
      return Math.round((done / all.length) * 100);
    }

    function getCategoryProgressPct(cat) {
      const total = LESSONS.length;
      const done = appState.completedLessons.length;
      if (cat === `OL`) return Math.min(100, Math.round((done / total) * 115));
      if (cat === `AL`) return Math.min(100, Math.round((done / total) * 85));
      return Math.round((done / total) * 100);
    }

    function awardXP(amount, skillKey) {
      appState.xp += amount;
      if (skillKey && appState.skills[skillKey] !== undefined) {
        appState.skills[skillKey] = Math.min(100, appState.skills[skillKey] + 3);
      }
      if (appState.xp >= 150 && !appState.badges.includes(`polyglot_spark`)) {
        appState.badges.push(`polyglot_spark`);
      }
      if (appState.gamesWon >= 3 && !appState.badges.includes(`game_master`)) {
        appState.badges.push(`game_master`);
      }
      saveAppState();
      updateTopbar();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`);
    }

      if (!LANGUAGES[langId]) return;
      appState.activeLang = langId;
      const unlocked = getUnlockedLevel(langId);
      if (appState.selectedLevel > unlocked) appState.selectedLevel = unlocked;
      const firstLesson = LESSONS.find(l => l.lang === langId && l.level === appState.selectedLevel) || LESSONS.find(l => l.lang === langId);
      if (firstLesson) appState.selectedLessonId = firstLesson.id;

                </button>

        return `

            <h2 class="card-title">${g.title}</h2>

              ${g.tones.map(t => `

    // =========================================================================
    // 7. INTERACTIVE ACTIVITIES & 10 MINI-GAMES ENGINES
    // =========================================================================
    function getPoolForActiveLang() {
      const items = [];
      LESSONS.filter(l => l.lang === appState.activeLang).forEach(l => {
        l.vocab.forEach(v => items.push({ ...v, level: l.level, lessonTitle: l.title, grammarNote: l.grammarNote }));
      });
      return items;
    }

    function setActivityFilter(f) {
      appState.activeActivityFilter = f;
      if (f !== `all`) appState.activeActivityId = f;
      renderApp();
    }

    function launchActivity(actId) {
      appState.activeActivityId = actId;
      renderApp();
    }

    function initActivityUI() {
      const act = ACTIVITIES_META.find(a => a.id === appState.activeActivityId) || ACTIVITIES_META[0];
      const titleEl = document.getElementById(`act-stage-title`);
      const bodyEl = document.getElementById(`act-stage-body`);
      if (!titleEl || !bodyEl) return;
      titleEl.textContent = act.name;

      const pool = getPoolForActiveLang();
      const target = pool[Math.floor(Math.random() * pool.length)];
      const distractors = pool.filter(p => p.en !== target.en).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [target, ...distractors].sort(() => Math.random() - 0.5);

      if (act.id === `flashcards`) {
        bodyEl.innerHTML = `
          <div class="card-soft fc-card" style="text-align:center;padding:var(--space-xl);">
            <div class="kicker">Tap card to reveal translation</div>
            <div class="script-box" style="margin:var(--space-md) 0;">${escapeHtml(target.term)}</div>
            <div class="fc-back" style="display:none;font-weight:700;color:var(--primary);margin-bottom:var(--space-md);">${escapeHtml(target.en)} (/${escapeHtml(target.pron)}/)</div>
            <div class="chip-row" style="justify-content:center;">
              <button class="btn btn-outline btn-sm" onclick="revealFlashcard(this)">Flip Card</button>
              <button class="btn btn-secondary btn-sm" onclick="speakText('${escapeHtml(target.term.replace(/'/g, ` `))}')">Listen</button>
              <button class="btn btn-primary btn-sm" onclick="awardXP(10,'reading');initActivityUI();">Next Card (+10 XP)</button>
            </div>
          </div>
        `;
      } else if (act.id === `writing` || act.id === `fillblank`) {
        bodyEl.innerHTML = `
          <p><strong>Prompt:</strong> Write or complete the expression for <em>"${escapeHtml(target.en)}"</em> (hint: ${escapeHtml(target.pron)}).</p>
          <div class="field" style="margin-top:var(--space-sm);">
            <label for="act-write-in">Your Answer</label>
            <input id="act-write-in" class="input" placeholder="Type in ${LANGUAGES[appState.activeLang].name}...">
          </div>
          <div class="chip-row" style="margin-top:var(--space-sm);">
            <button class="btn btn-primary btn-sm" onclick="checkActivityText('${escapeHtml(target.term)}')">Check Answer</button>
            <button class="btn btn-outline btn-sm" onclick="initActivityUI()">New Prompt</button>
          </div>
          <div id="act-feedback"></div>
        `;
      } else if (act.id === `listening` || act.id === `pronunciation`) {
        bodyEl.innerHTML = `
          <p>Listen to the audio cue, then select the matching English meaning.</p>
          <button class="btn btn-secondary" style="margin:var(--space-sm) 0;" onclick="speakText('${escapeHtml(target.term.replace(/'/g, ` `))}')">
            <i data-lucide="volume-2"></i> Play Spoken Phrase
          </button>
          <div style="display:flex;flex-direction:column;gap:var(--space-xs);margin-top:var(--space-sm);">
            ${options.map(o => `
              <button class="btn btn-outline" onclick="checkActivityChoice(this, ${o.en === target.en})">${escapeHtml(o.en)}</button>
            `).join(``)}
          </div>
          <div id="act-feedback"></div>
        `;
      } else {
        bodyEl.innerHTML = `
          <p><strong>Select the accurate meaning for:</strong></p>
          <div class="script-box" style="margin:var(--space-sm) 0;">${escapeHtml(target.term)}</div>
          <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
            ${options.map(o => `
              <button class="btn btn-outline" onclick="checkActivityChoice(this, ${o.en === target.en})">${escapeHtml(o.en)}</button>
            `).join(``)}
          </div>
          <div id="act-feedback"></div>
        `;
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function revealFlashcard(btn) {
      const card = btn ? btn.closest(`.fc-card`) : null;
      const back = card ? card.querySelector(`.fc-back`) : null;
      if (back) back.style.display = `block`;
    }

    function checkActivityChoice(btn, isRight) {
      const fb = document.getElementById(`act-feedback`);
      if (!fb) return;
      if (isRight) {
        awardXP(15, `reading`);
        fb.innerHTML = `<div class="feedback-banner feedback-ok">Correct! +15 XP awarded. Loading next prompt…</div>`;
        setTimeout(initActivityUI, 900);
      } else {
        fb.innerHTML = `<div class="feedback-banner feedback-err">Not quite — try another option or listen to the audio cue.</div>`;
      }
    }

    function checkActivityText(expected) {
      const inp = document.getElementById(`act-write-in`);
      const fb = document.getElementById(`act-feedback`);
      if (!inp || !fb) return;
      const val = inp.value.trim().toLowerCase();
      if (!val) {
        fb.innerHTML = `<div class="feedback-banner feedback-err">Please type an answer before checking.</div>`;
        return;
      }
      if (expected.toLowerCase().includes(val) || val.length >= 2) {
        awardXP(15, `writing`);
        fb.innerHTML = `<div class="feedback-banner feedback-ok">Model answer: ${escapeHtml(expected)}. +15 XP awarded!</div>`;
      }
    }

    // ---- MINI-GAMES ENGINE (All 10 Mini-Games Fully Playable) ----
    function selectMiniGame(gameId) {
      stopGameTimer();
      appState.activeGameId = gameId;
      saveAppState();
      renderApp();
    }

    function stopGameTimer() {
      if (gameTimerId) { clearInterval(gameTimerId); gameTimerId = null; }
    }

    function initMiniGameUI() {
      const box = document.getElementById(`game-arena-content`);
      if (!box) return;
      const meta = MINIGAMES_META.find(g => g.id === appState.activeGameId) || MINIGAMES_META[0];
      const pool = getPoolForActiveLang();
      gameRuntime = { id: meta.id, score: 0, round: 1, maxRounds: 5, timeLeft: 30, selectedLeft: null, matched: 0, flipped: [] };

      box.innerHTML = `
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md);">
          <div>
            <div class="kicker">Reward: +${meta.xp} XP</div>
            <h2 class="section-title">${meta.name}</h2>
            <p style="color:var(--on-surface-variant);">${meta.desc}</p>
          </div>
          <div class="chip-row">
            <span class="badge tabular" id="game-score-pill">Score: 0</span>
            <span class="badge badge-neutral tabular" id="game-round-pill">Round 1/${gameRuntime.maxRounds}</span>
            <button class="btn btn-outline btn-sm" onclick="initMiniGameUI()">Restart</button>
          </div>
        </div>
        <div id="game-board" class="card-soft"></div>
        <div id="game-feedback"></div>
      `;

      renderGameRound(pool, meta);
    }

    function renderGameRound(pool, meta) {
      const board = document.getElementById(`game-board`);
      if (!board) return;
      const scoreEl = document.getElementById(`game-score-pill`);
      const roundEl = document.getElementById(`game-round-pill`);
      if (scoreEl) scoreEl.textContent = `Score: ${gameRuntime.score}`;
      if (roundEl) roundEl.textContent = gameRuntime.id === `speed_quiz` ? `Time: ${gameRuntime.timeLeft}s` : `Round ${gameRuntime.round}/${gameRuntime.maxRounds}`;

      if (gameRuntime.id === `word_matching`) {
        const pairs = pool.slice().sort(() => Math.random() - 0.5).slice(0, 4);
        const rights = pairs.slice().sort(() => Math.random() - 0.5);
        board.innerHTML = `
          <p style="margin-bottom:var(--space-sm);font-weight:700;">Tap a foreign term, then tap its matching English translation:</p>
          <div class="split-grid">
            <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
              ${pairs.map((p, i) => `<button class="btn btn-outline" id="match-l-${i}" onclick="pickMatchLeft(${i}, '${escapeHtml(p.en)}')">${escapeHtml(p.term)}</button>`).join(``)}
            </div>
            <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
              ${rights.map((p, i) => `<button class="btn btn-outline" id="match-r-${i}" onclick="pickMatchRight(${i}, '${escapeHtml(p.en)}')">${escapeHtml(p.en)}</button>`).join(``)}
            </div>
          </div>
        `;
        return;
      }

      if (gameRuntime.id === `memory_cards`) {
        const pairs = pool.slice().sort(() => Math.random() - 0.5).slice(0, 4);
        const cards = [];
        pairs.forEach((p, idx) => {
          cards.push({ key: idx, text: p.term });
          cards.push({ key: idx, text: p.en });
        });
        cards.sort(() => Math.random() - 0.5);
        gameRuntime.memCards = cards;
        gameRuntime.memOpen = [];
        gameRuntime.memDone = [];
        board.innerHTML = `
          <div class="tone-grid">
            ${cards.map((c, idx) => `
              <button class="card" id="mem-card-${idx}" style="min-height:84px;font-weight:700;cursor:pointer;" onclick="flipMemoryCard(${idx})">?</button>
            `).join(``)}
          </div>
        `;
        return;
      }

      if (gameRuntime.id === `sentence_builder`) {
        const activeLesson = LESSONS.find(l => l.lang === appState.activeLang && l.dialogue.length) || LESSONS[0];
        const targetLine = activeLesson.dialogue[0].line;
        const tokens = targetLine.split(` `).filter(Boolean);
        const shuffled = tokens.slice().sort(() => Math.random() - 0.5);
        gameRuntime.expectedSentence = tokens.join(` `);
        gameRuntime.builtTokens = [];
        board.innerHTML = `
          <p style="font-weight:700;">Arrange the tokens to form: <em>"${escapeHtml(activeLesson.dialogue[0].en)}"</em></p>
          <div id="sb-target" class="card" style="min-height:54px;margin:var(--space-sm) 0;font-weight:800;">Tap words below…</div>
          <div class="chip-row" id="sb-bank">
            ${shuffled.map((t, i) => `<button class="chip" id="sb-tok-${i}" onclick="addSentenceToken(${i}, '${escapeHtml(t)}')">${escapeHtml(t)}</button>`).join(``)}
          </div>
          <div class="chip-row" style="margin-top:var(--space-md);">
            <button class="btn btn-primary btn-sm" onclick="checkSentenceBuilder()">Verify Sentence</button>
            <button class="btn btn-outline btn-sm" onclick="renderGameRound(getPoolForActiveLang(), MINIGAMES_META[2])">Reset Words</button>
          </div>
        `;
        return;
      }

      if (gameRuntime.id === `speed_quiz` && !gameTimerId) {
        gameTimerId = setInterval(() => {
          gameRuntime.timeLeft -= 1;
          const el = document.getElementById(`game-round-pill`);
          if (el) el.textContent = `Time: ${gameRuntime.timeLeft}s`;
          if (gameRuntime.timeLeft <= 0) {
            stopGameTimer();
            finishMiniGame(meta);
          }
        }, 1000);
      }

      // Default quiz engine for Vocab Challenge, Listening, Character Recognition, Grammar, Daily, Level Completion
      const target = pool[Math.floor(Math.random() * pool.length)];
      const distractors = pool.filter(p => p.en !== target.en).sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = [target, ...distractors].sort(() => Math.random() - 0.5);

      let promptHtml = `<div class="script-box" style="margin-bottom:var(--space-sm);">${escapeHtml(target.term)}</div>`;
      if (gameRuntime.id === `listening_challenge`) {
        promptHtml = `
          <button class="btn btn-secondary" style="margin-bottom:var(--space-sm);" onclick="speakText('${escapeHtml(target.term.replace(/'/g, ` `))}')">
            <i data-lucide="volume-2"></i> Play Audio Clue
          </button>
        `;
      } else if (gameRuntime.id === `char_recognition`) {
        promptHtml = `<div class="kicker">Pronunciation: /${escapeHtml(target.pron)}/</div><div class="script-box" style="margin:var(--space-xs) 0;">${escapeHtml(target.term)}</div>`;
      } else if (gameRuntime.id === `grammar_challenge`) {
        promptHtml = `<p class="card-soft" style="margin-bottom:var(--space-sm);"><strong>Grammar clue:</strong> ${escapeHtml(target.grammarNote)}</p><div style="font-weight:800;margin-bottom:var(--space-sm);">Which meaning matches <em>${escapeHtml(target.term)}</em>?</div>`;
      }

      board.innerHTML = `
        ${promptHtml}
        <div class="card-grid" style="margin-top:var(--space-sm);">
          ${opts.map(o => `
            <button class="btn btn-outline" onclick="answerMiniGameQuiz(${o.en === target.en})">${escapeHtml(o.en)}</button>
          `).join(``)}
        </div>
      `;
      if (window.lucide) window.lucide.createIcons();
    }

    function answerMiniGameQuiz(isRight) {
      const fb = document.getElementById(`game-feedback`);
      const meta = MINIGAMES_META.find(g => g.id === appState.activeGameId) || MINIGAMES_META[0];
      if (isRight) {
        gameRuntime.score += 20;
        playTone(659.25, 0.1);
        if (fb) fb.innerHTML = `<div class="feedback-banner feedback-ok">Spot on! +20 pts</div>`;
      } else {
        playTone(220, 0.12);
        if (fb) fb.innerHTML = `<div class="feedback-banner feedback-err">Missed that one — keep going!</div>`;
      }
      if (gameRuntime.id === `speed_quiz`) {
        renderGameRound(getPoolForActiveLang(), meta);
        return;
      }
      gameRuntime.round += 1;
      if (gameRuntime.round > gameRuntime.maxRounds) {
        finishMiniGame(meta);
      } else {
        setTimeout(() => renderGameRound(getPoolForActiveLang(), meta), 550);
      }
    }

    function pickMatchLeft(idx, en) {
      gameRuntime.selectedLeft = { idx, en };
      document.querySelectorAll(`[id^="match-l-"]`).forEach(b => b.classList.remove(`btn-primary`));
      const btn = document.getElementById(`match-l-${idx}`);
      if (btn) btn.classList.add(`btn-primary`);
    }

    function pickMatchRight(idx, en) {
      if (!gameRuntime.selectedLeft) return;
      const fb = document.getElementById(`game-feedback`);
      if (gameRuntime.selectedLeft.en === en) {
        const lBtn = document.getElementById(`match-l-${gameRuntime.selectedLeft.idx}`);
        const rBtn = document.getElementById(`match-r-${idx}`);
        if (lBtn) lBtn.disabled = true;
        if (rBtn) rBtn.disabled = true;
        gameRuntime.score += 25;
        gameRuntime.matched += 1;
        gameRuntime.selectedLeft = null;
        if (fb) fb.innerHTML = `<div class="feedback-banner feedback-ok">Matched!</div>`;
        if (gameRuntime.matched >= 4) finishMiniGame(MINIGAMES_META[1]);
      } else {
        if (fb) fb.innerHTML = `<div class="feedback-banner feedback-err">Not a match — try another pair.</div>`;
      }
    }

    function flipMemoryCard(idx) {
      if (gameRuntime.memDone.includes(idx) || gameRuntime.memOpen.includes(idx) || gameRuntime.memOpen.length >= 2) return;
      const btn = document.getElementById(`mem-card-${idx}`);
      if (btn) btn.textContent = gameRuntime.memCards[idx].text;
      gameRuntime.memOpen.push(idx);
      if (gameRuntime.memOpen.length === 2) {
        const [a, b] = gameRuntime.memOpen;
        if (gameRuntime.memCards[a].key === gameRuntime.memCards[b].key) {
          gameRuntime.memDone.push(a, b);
          gameRuntime.score += 25;
          gameRuntime.memOpen = [];
          if (gameRuntime.memDone.length === gameRuntime.memCards.length) finishMiniGame(MINIGAMES_META[6]);
        } else {
          setTimeout(() => {
            const ba = document.getElementById(`mem-card-${a}`);
            const bb = document.getElementById(`mem-card-${b}`);
            if (ba) ba.textContent = `?`;
            if (bb) bb.textContent = `?`;
            gameRuntime.memOpen = [];
          }, 700);
        }
      }
    }

    function addSentenceToken(idx, tok) {
      const btn = document.getElementById(`sb-tok-${idx}`);
      if (btn) btn.disabled = true;
      gameRuntime.builtTokens.push(tok);
      const tgt = document.getElementById(`sb-target`);
      if (tgt) tgt.textContent = gameRuntime.builtTokens.join(` `);
    }

    function checkSentenceBuilder() {
      const fb = document.getElementById(`game-feedback`);
      const built = gameRuntime.builtTokens.join(` `);
      if (built === gameRuntime.expectedSentence) {
        gameRuntime.score = 100;
        finishMiniGame(MINIGAMES_META[2]);
      } else if (fb) {
        fb.innerHTML = `<div class="feedback-banner feedback-err">Order mismatch — tap Reset Words and try again.</div>`;
      }
    }

    function finishMiniGame(meta) {
      stopGameTimer();
      appState.gamesWon += 1;
      awardXP(meta.xp, `listening`);
      if (meta.id === `level_challenge` && gameRuntime.score >= 60) {
        const cur = getUnlockedLevel(appState.activeLang);
        if (cur < 5) unlockLevelNow(cur + 1);
      }
      const board = document.getElementById(`game-board`);
      if (board) {
        board.innerHTML = `
          <div style="text-align:center;padding:var(--space-lg);">
            <div class="section-title">Round Complete!</div>
            <p style="margin:var(--space-sm) 0;">Final Score: <strong>${gameRuntime.score}</strong> · Reward Earned: <strong>+${meta.xp} XP</strong></p>
            <button class="btn btn-primary" onclick="initMiniGameUI()">Play Again</button>
          </div>
        `;
      }
    }

    // =========================================================================
    // 8. ACTION HANDLERS (All hoisted function declarations)
    // =========================================================================
    function selectAvatar(avId) {
      appState.profile.avatar = avId;
      saveAppState();
      renderApp();
    }

    function toggleDailyTask(taskId) {
      const idx = appState.dailyTasksDone.indexOf(taskId);
      if (idx >= 0) {
        appState.dailyTasksDone.splice(idx, 1);
      } else {
        appState.dailyTasksDone.push(taskId);
        awardXP(20, `reading`);
      }
      saveAppState();
      renderApp();
    }

    function openLevelLessons(level) {
      appState.selectedLevel = level;
      const found = LESSONS.find(l => l.lang === appState.activeLang && l.level === level);
      if (found) appState.selectedLessonId = found.id;
      navigateTo(`lessons`);
    }

    function unlockLevelNow(level) {
      const langId = appState.activeLang;
      if (!appState.unlockedLevels[langId]) appState.unlockedLevels[langId] = { OL: 1, AL: 1 };
      const key = getEffectiveCategoryKey();
      appState.unlockedLevels[langId][key] = Math.max(appState.unlockedLevels[langId][key] || 1, level);
      if (level >= 2 && !appState.badges.includes(`level_climber`)) {
        appState.badges.push(`level_climber`);
      }
      saveAppState();
      renderApp();
    }

    function startLevelAssessment() {
      appState.activeGameId = `level_challenge`;
      navigateTo(`games`);
    }

    function selectLesson(lessonId) {
      appState.selectedLessonId = lessonId;
      saveAppState();
      renderApp();
    }

    function toggleBookmark(lessonId) {
      const idx = appState.bookmarks.indexOf(lessonId);
      if (idx >= 0) appState.bookmarks.splice(idx, 1);
      else appState.bookmarks.push(lessonId);
      saveAppState();
      renderApp();
    }

    function completeLesson(lessonId) {
      if (!appState.completedLessons.includes(lessonId)) {
        appState.completedLessons.push(lessonId);
        awardXP(25, `speaking`);
      }
      saveAppState();
      renderApp();
    }

    function showScriptDetail(ch, title, detail, langId) {
      speakText(ch, langId);
      if (!appState.badges.includes(`script_explorer`)) appState.badges.push(`script_explorer`);
      const out = document.getElementById(`script-detail-out`);
      if (out) {
        out.innerHTML = `<span class="script-box" style="font-size:1.75rem;margin-right:12px;">${escapeHtml(ch)}</span> <strong>${escapeHtml(title)}</strong> — ${escapeHtml(detail)}`;
      }
      saveAppState();
    }

    function submitLessonWriting(lessonId) {
      const box = document.getElementById(`lesson-writing-box`);
      const fb = document.getElementById(`lesson-writing-feedback`);
      if (!box || !fb) return;
      const text = box.value.trim();
      if (text.length < 6) {
        fb.innerHTML = `<div class="feedback-banner feedback-err">Write at least 6 characters to save and receive feedback.</div>`;
        return;
      }
      appState.notesByLesson[lessonId] = text;
      awardXP(10, `writing`);
      fb.innerHTML = `<div class="feedback-banner feedback-ok">Saved! Good sentence structure (${text.split(/\s+/).length} words). +10 XP earned.</div>`;
    }

    function saveProfileSettings() {
      const nameEl = document.getElementById(`set-name`);
      const schoolEl = document.getElementById(`set-school`);
      const dEl = document.getElementById(`notif-daily`);
      const eEl = document.getElementById(`notif-exam`);
      const sEl = document.getElementById(`notif-sound`);
      const msg = document.getElementById(`settings-msg`);
      if (nameEl && nameEl.value.trim()) appState.profile.name = nameEl.value.trim();
      if (schoolEl && schoolEl.value.trim()) appState.profile.school = schoolEl.value.trim();
      if (dEl) appState.profile.notifications.dailyReminder = dEl.checked;
      if (eEl) appState.profile.notifications.examAlerts = eEl.checked;
      if (sEl) appState.profile.notifications.soundEffects = sEl.checked;
      saveAppState();
      updateTopbar();
      if (msg) msg.innerHTML = `<div class="feedback-banner feedback-ok">Profile settings saved.</div>`;
    }

    function syncGoalMins(val) {
      const el = document.getElementById(`goal-mins-val`);
      if (el) el.textContent = `${val} min`;
    }

    function saveStudyGoals() {
      const mins = document.getElementById(`goal-mins`);
      const les = document.getElementById(`goal-lessons`);
      const voc = document.getElementById(`goal-vocab`);
      const tm = document.getElementById(`goal-time`);
      const msg = document.getElementById(`goals-msg`);
      if (mins) appState.goals.dailyMinutes = Number(mins.value);
      if (les) appState.goals.dailyLessons = Number(les.value);
      if (voc) appState.goals.dailyVocab = Math.max(5, Math.min(50, Number(voc.value) || 15));
      if (tm && tm.value) appState.goals.reminderTime = tm.value;
      saveAppState();
      if (msg) msg.innerHTML = `<div class="feedback-banner feedback-ok">Study goals updated and synced to your Daily Tasks!</div>`;
    }

    function exportProgressData() {
      const rows = [
        `Metric,Value`,
        `Student,${appState.profile.name}`,
        `Active Language,${LANGUAGES[appState.activeLang].name}`,
        `Category,${appState.category}`,
        `XP,${appState.xp}`,
        `Completed Lessons,${appState.completedLessons.length}`
      ].join(`\n`);
      if (window.notebookAppApi && typeof window.notebookAppApi.triggerFileDownload === `function`) {
        window.notebookAppApi.triggerFileDownload({
          content: rows,
          contentType: `text/csv`,
          encoding: `UTF-8`,
          filename: `lingo-mate-progress.csv`
        });
      }
    }

    function resetAllProgress(btn) {
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `Click again to confirm reset`;
        return;
      }
      btn.dataset.armed = `false`;
      btn.textContent = `Reset All Progress`;
      appState = cloneState(DEFAULT_STATE);
      saveAppState();
      renderApp();
    }

    // =========================================================================
    // 9. BOOTSTRAP
    // =========================================================================
    (async function boot() {
      await loadAppState();
      renderApp();
      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
        window.notebookAppApi.notifyAppReady();
      }
    })();
  </script>
</body>
</html>
